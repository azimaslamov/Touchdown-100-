<style>
:root{--bg:#eef0f4;--ink:#23262f;--sub:#5d6573;--card:#fffffff0;--line:#d5d9e0;--ov:#eef0f4a8;--y:#f4c20d;--g:#22b573;--r:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--ink:#f1f3f6;--sub:#a3abb8;--card:#23262df0;--line:#363b45;--ov:#15171cb8}}
:root[data-theme="dark"]{--bg:#15171c;--ink:#f1f3f6;--sub:#a3abb8;--card:#23262df0;--line:#363b45;--ov:#15171cb8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:700 16px/1.3 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:none}
#app{position:relative;height:100%;overflow:hidden}
#bg{position:absolute;inset:0;overflow:hidden}
#bg canvas{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh*.643));aspect-ratio:360/560;filter:blur(4px);opacity:0}
#bg::after{content:"";position:absolute;inset:0;background:var(--ov)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:14px 16px}
.scr.on{display:flex}
h1{margin:0;font-size:46px;font-weight:900;letter-spacing:-1px;text-align:center}
h2{margin:0;font-size:22px;font-weight:900;flex:1}
.sub{color:var(--sub);text-align:center;margin:4px 0 0;font-weight:600}
.hz{height:10px;margin:12px auto 0;width:150px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--y) 0 8px,#2b2d33 8px 16px)}
.btn{border:0;border-radius:16px;padding:16px 18px;font:inherit;font-weight:800;color:var(--ink);background:var(--card);box-shadow:0 2px 0 var(--line),0 0 0 1.5px var(--line) inset;cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn.main{background:var(--y);color:#23262f;font-size:24px;padding:20px;box-shadow:0 4px 0 #b78f00}
.btn.main:active{transform:translateY(4px);box-shadow:0 0 0 #b78f00}
.menu{margin:auto;width:min(330px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch}
.chip{align-self:flex-end;background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:0 0 0 1.5px var(--line) inset}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .btn{padding:10px 14px}
#grid,#mg{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;overflow:auto;padding:4px 2px 16px;touch-action:pan-y}
.lv{aspect-ratio:1;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;gap:2px}
.lv small{font-size:11px;color:var(--y);letter-spacing:1px;min-height:13px;text-shadow:0 0 1px #0006}
.lv:disabled{opacity:.45;cursor:default}
.by{margin-top:auto;flex:none;text-align:left;color:var(--sub);font-size:13px;font-weight:700;padding:10px 0 2px}
.list{display:flex;flex-direction:column;gap:10px;overflow:auto;touch-action:pan-y;padding-bottom:16px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 0 0 1.5px var(--line) inset}
.row>div{flex:1}.row small{display:block;color:var(--sub);font-weight:600}
.row .btn{padding:10px 14px;background:var(--y);color:#23262f}
.row .btn.off{background:var(--line);color:var(--sub)}
.tg{width:54px;height:30px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--g)}.tg.on::after{left:27px}
#game{padding:10px 0 0}
#head{text-align:center;font-size:20px;font-weight:900;padding:0 56px;position:relative;min-height:28px}
#pz{position:absolute;right:12px;top:-4px;padding:8px 12px!important}
#hud{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--sub);font-weight:700;margin:6px 0 2px;flex-wrap:wrap}
#fb{width:70px;height:8px;border-radius:9px;background:var(--line);display:inline-block;vertical-align:middle;overflow:hidden}
#fb i{display:block;height:100%;background:var(--g);width:100%}
#cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#c{display:block}
#ctl{height:118px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;gap:10px}
.cb{border:0;border-radius:22px;background:var(--card);color:var(--ink);font-size:34px;height:84px;width:84px;box-shadow:0 0 0 2px var(--line) inset;touch-action:none}
.cb.on{background:var(--y);color:#23262f}
#bt{width:min(46vw,190px);height:92px;background:var(--y);color:#23262f;font-size:22px;font-weight:900}
#bt.on{background:#ff9a1f}
#md{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0000006b;padding:20px;z-index:5}
#md.on{display:flex}
.card{background:var(--bg);border-radius:22px;padding:22px;width:min(340px,100%);text-align:center;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:26px;font-weight:900}.card p{margin:0;color:var(--sub)}
.big{font-size:34px;letter-spacing:4px;color:var(--y)}
.pm{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:20px}
.pm b{font-size:26px;font-weight:900}
.pm span{color:var(--sub);font-weight:600;font-size:14px;line-height:1.35}
.pm em{font-style:normal;color:var(--ink);font-size:15px;margin-top:4px;opacity:.8}
#ow{padding:0}
#owc{position:absolute;inset:0;width:100%;height:100%;display:block}
#owhud{position:absolute;left:12px;top:12px}
#owfw{width:150px;height:11px;background:#1f293722;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #1f293755}
#owfb{height:100%;width:100%;background:var(--g)}#owfb.lo{background:var(--r)}
#owinfo{margin-top:7px;font-size:13px;color:var(--ink);text-shadow:0 1px 0 var(--bg)}
#owrow{display:flex;gap:8px;margin-top:8px}
#owpz,#owrt{padding:8px 12px!important}
#owrt{font-size:14px}
#owrt.pl{animation:owp .9s infinite}
@keyframes owp{50%{background:var(--y);color:#23262f}}
#owmm{position:absolute;right:12px;top:12px;width:116px;height:116px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2.5px #1f2937cc;background:#59616d}
#owmm canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#owts{position:absolute;left:50%;top:140px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}#owts.on{opacity:1}
#owctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 16px;pointer-events:none}
.oc{pointer-events:auto;width:84px;height:84px;border-radius:24px;border:0;background:#1f2937cc;color:#fff;font-size:30px;touch-action:none}
.oc.on{background:var(--y);color:#111}
#owbt{width:120px;background:var(--y);color:#111;box-shadow:0 5px 0 #b45309}#owbt.on{background:#f59e0b}
#owov,#owpk{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0000006b;padding:20px;z-index:5}
#owov.on,#owpk.on{display:flex}
#owpg{display:flex;flex-direction:column;gap:10px}
#owpg .btn{padding:16px;font-size:18px}
#owpg .btn:disabled{opacity:.4;cursor:default}
h1{font-size:34px}.n{background:var(--y);color:#23262f;border-radius:10px;padding:0 9px;margin-left:4px}
.two{display:flex;gap:12px}.two .btn{flex:1;position:relative}
.dot::after{content:"";position:absolute;top:8px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--r);box-shadow:0 0 0 2px var(--card)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tb{flex:1;padding:12px!important}.tb.on{background:var(--y);color:#23262f}
.ui{font-size:30px;width:44px;text-align:center;flex:none!important}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:16px;height:7px;border-radius:4px;background:var(--line);display:block}.pips i.f{background:var(--y)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g)}
